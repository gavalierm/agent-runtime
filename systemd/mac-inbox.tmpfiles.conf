# Schránka agenta na Macu (tu príklad cyril) na serveri, ako každý agent.
# Inštaluje správca servera ako root do /etc/tmpfiles.d/cyril-inbox.conf.
# Správy a odpovede pre agenta píšu agenti servera (root) do inbox, Mac ich
# číta cez ssh príkazom ask_agent.sh --replies a prečítané presúva do
# processed. Skupina agent-inbox je tá istá ako pri schránke iných agentov,
# setgid 2770 dedí skupinu novým súborom. Prečítané správy sa po 30 dňoch
# zmažú, vek podľa mtime.
d /var/lib/cyril           0710 root agent-inbox -
d /var/lib/cyril/inbox     2770 root agent-inbox -
d /var/lib/cyril/processed 2770 root agent-inbox m:30d
