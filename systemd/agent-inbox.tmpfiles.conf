# Schránka agenta (tu príklad adam). Inštaluje správca servera ako root do
# /etc/tmpfiles.d/adam-inbox.conf.
# Skupina agent-inbox píše do schránky: používatelia, ktorí agentovi píšu
# (napríklad ssh používateľ pre ask_agent.sh z Macu, agenti servera). Root, pod
# ktorým beží T3 server, budič a odpovede agenta, píše vždy. Spracované správy
# a prečítané odpovede sa po 30 dňoch zmažú, vek podľa mtime.
d /var/lib/adam           0710 root agent-inbox -
d /var/lib/adam/inbox     2770 root agent-inbox -
d /var/lib/adam/outbox    2770 root agent-inbox -
d /var/lib/adam/processed 2770 root agent-inbox m:30d
